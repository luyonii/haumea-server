worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr info;

    upstream secblind_go {
        server host.docker.internal:8080;
    }

    server {
        listen 443 ssl;
        http2  off;             # client uses WinHTTP HTTP/1.1
        server_name secblind.local;

        ssl_certificate     /etc/nginx/cert/leaf.crt;
        ssl_certificate_key /etc/nginx/cert/leaf.key;
        ssl_protocols       TLSv1.3;  # client pins TLS 1.3 only
        ssl_prefer_server_ciphers off;

        location /api/ {
            proxy_pass http://secblind_go;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 30s;
        }

        location / { return 404; }
    }
}
