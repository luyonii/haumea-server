<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="title">Admin</div>
</header>
<div class="layout">
    <nav class="sidebar">
        <ul class="resource-list">
            <li class="resource active" data-resource="records">Records</li>
        </ul>
    </nav>
    <main class="main">
        <div class="filter-row">
            <input id="filter" class="filter-input" placeholder="Filter…" type="text">
            <button id="refresh" class="btn">Refresh</button>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Created At</th></tr>
                </thead>
                <tbody id="data-body">
                    <tr class="empty"><td colspan="3">No records.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <aside id="detail-panel" class="detail-panel hidden">
        <div class="detail-header">
            <div class="detail-title">Detail</div>
            <button class="btn-link" data-close="detail-panel">Close</button>
        </div>
        <dl class="detail-fields" id="detail-fields"></dl>
        <button id="edit-btn" class="btn btn-primary">Edit</button>
    </aside>
</div>
<div id="edit-modal" class="modal hidden">
    <div class="modal-backdrop" data-close="edit-modal"></div>
    <div class="modal-body">
        <div class="modal-header">
            <div class="modal-title">Edit</div>
            <button class="btn-link" data-close="edit-modal">Close</button>
        </div>
        <form id="edit-form">
            <label>Name<input type="text" name="name"></label>
            <div class="modal-actions">
                <button type="button" class="btn" data-close="edit-modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
