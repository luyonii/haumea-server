<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="title">Admin</div>
    <div id="toast" class="toast hidden"></div>
</header>
<div class="layout">
    <nav class="sidebar">
        <ul class="resource-list">
            <li class="resource active" data-resource="licenses">Licenses</li>
        </ul>
    </nav>
    <main class="main">
        <div class="filter-row">
            <input id="filter" class="filter-input" placeholder="Filter…" type="text">
            <button id="refresh" class="btn">Refresh</button>
            <button id="new-btn" class="btn btn-primary hidden">+ New</button>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead id="data-head"></thead>
                <tbody id="data-body"></tbody>
            </table>
        </div>
    </main>
    <aside id="detail-panel" class="detail-panel hidden">
        <div class="detail-header">
            <div class="detail-title">Detail</div>
            <button class="btn-link" data-close="detail-panel">Close</button>
        </div>
        <dl class="detail-fields" id="detail-fields"></dl>
        <button id="action-btn" class="btn btn-primary hidden"></button>
    </aside>
</div>
<div id="new-license-modal" class="modal hidden">
    <div class="modal-backdrop" data-close="new-license-modal"></div>
    <div class="modal-body">
        <div class="modal-header">
            <div class="modal-title">New license</div>
            <button class="btn-link" data-close="new-license-modal">Close</button>
        </div>
        <form id="new-license-form">
            <label>Prefix (optional, A-Z 0-9, up to 8 chars; default SB)
                <input type="text" name="prefix" maxlength="8" pattern="[A-Z0-9]*"
                       style="text-transform: uppercase" autocomplete="off">
            </label>
            <label>Note (optional, up to 512 chars)
                <input type="text" name="note" maxlength="512" autocomplete="off">
            </label>
            <div class="modal-actions">
                <button type="button" class="btn" data-close="new-license-modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Create</button>
            </div>
        </form>
    </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
